 y="40">Nurse E. ▾</text><rect fill="#EAF2F8" height="64" rx="0" ry="0" stroke="#C8D3DF" stroke-width="1" width="1600" x="0" y="70" /><rect fill="#FFFFFF" height="40" rx="6" ry="6" stroke="#0F6B78" stroke-width="2" width="190" x="30" y="82" /><text fill="#0F6B78" font-family="DejaVu Sans" font-size="15" font-style="normal" font-weight="bold" text-anchor="middle" x="125" y="108">UX Design System</text><rect fill="none" height="40" rx="6" ry="6" stroke="none" stroke-width="1" width="190" x="235" y="82" /><text fill="#344054" font-family="DejaVu Sans" font-size="15" font-style="normal" font-weight="normal" text-anchor="middle" x="330" y="108">Components</text><rect fill="none" height="40" rx="6" ry="6" stroke="none" stroke-width="1" width="190" x="440" y="82" /><text fill="#344054" font-family="DejaVu Sans" font-size="15" font-style="normal" font-weight="normal" text-anchor="middle" x="535" y="108">Status Language</text><rect fill="none" height="40" rx="6" ry="6" stroke="none" stroke-width="1" width="190" x="645" y="82" /><text fill="#344054" font-family="DejaVu Sans" font-size="15" font-style="normal" font-weight="normal" text-anchor="middle" x="740" y="108">Accessibility</text><text fill="#17375E" font-family="DejaVu Sans" font-size="26" font-style="normal" font-weight="bold" text-anchor="start" x="28" y="174">Clinical Desktop Design System</text><rect fill="#FFFFFF" height="290" rx="10" ry="10" stroke="#C8D3DF" stroke-width="1" width="480" x="28" y="196" /><text fill="#17375E" font-family="DejaVu Sans" font-size="18" font-style="normal" font-weight="bold" text-anchor="start" x="48" y="232">Color and status semantics</text><rect fill="#E9F7EF" height="34" rx="6" ry="6" stroke="#18794E" stroke-width="1" width="420" x="48" y="256" /><circle cx="66" cy="273" fill="#18794E" r="6" stroke="none" stroke-width="1" /><text fill="#18794E" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="bold" text-anchor="start" x="82" y="278">Routine / completed</text><rect fill="#FFF4CE" height="34" rx="6" ry="6" stroke="#9A6700" stroke-width="1" width="420" x="48" y="300" /><circle cx="66" cy="317" fill="#9A6700" r="6" stroke="none" stroke-width="1" /><text fill="#9A6700" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="bold" text-anchor="start" x="82" y="322">Repeat required</text><rect fill="#FFF1E8" height="34" rx="6" ry="6" stroke="#B54708" stroke-width="1" width="420" x="48" y="344" /><circle cx="66" cy="361" fill="#B54708" r="6" stroke="none" stroke-width="1" /><text fill="#B54708" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="bold" text-anchor="start" x="82" y="366">Referral</text><rect fill="#FDECEC" height="34" rx="6" ry="6" stroke="#B42318" stroke-width="1" width="420" x="48" y="388" /><circle cx="66" cy="405" fill="#B42318" r="6" stroke="none" stroke-width="1" /><text fill="#B42318" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="bold" text-anchor="start" x="82" y="410">Urgent referral</text><rect fill="#F1ECFF" height="34" rx="6" ry="6" stroke="#6941C6" stroke-width="1" width="420" x="48" y="432" /><circle cx="66" cy="449" fill="#6941C6" r="6" stroke="none" stroke-width="1" /><text fill="#6941C6" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="bold" text-anchor="start" x="82" y="454">Sync / technical</text><text fill="#667085" font-family="DejaVu Sans" font-size="12" font-style="normal" font-weight="normal" text-anchor="start" x="48" y="472">Every color is paired with text and an icon.</text><rect fill="#FFFFFF" height="290" rx="10" ry="10" stroke="#C8D3DF" stroke-width="1" width="1044" x="528" y="196" /><text fill="#17375E" font-family="DejaVu Sans" font-size="18" font-style="normal" font-weight="bold" text-anchor="start" x="548" y="232">Core interaction components</text><rect fill="#1F4E78" height="40" rx="6" ry="6" stroke="#1F4E78" stroke-width="1" width="160" x="548" y="258" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="bold" text-anchor="middle" x="628.0" y="283.0">Primary action</text><rect fill="#FFFFFF" height="40" rx="6" ry="6" stroke="#C8D3DF" stroke-width="1" width="160" x="720" y="258" /><text fill="#1F4E78" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="bold" text-anchor="middle" x="800.0" y="283.0">Secondary</text><rect fill="#18794E" height="40" rx="6" ry="6" stroke="#18794E" stroke-width="1" width="160" x="892" y="258" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="bold" text-anchor="middle" x="972.0" y="283.0">Complete</text><text fill="#344054" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="start" x="548" y="318">Patient search</text><rect fill="#FFFFFF" height="42" rx="6" ry="6" stroke="#C8D3DF" stroke-width="1" width="330" x="548" y="326" /><text fill="#1F2937" font-family="DejaVu Sans" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="560" y="357">Grace N.</text><rect fill="#FFF1E8" height="28" rx="14" ry="14" stroke="none" stroke-width="1" width="140" x="900" y="328" /><text fill="#B54708" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="middle" x="970.0" y="347">Open referral</text><rect fill="#FFF4CE" height="28" rx="14" ry="14" stroke="none" stroke-width="1" width="140" x="1054" y="328" /><text fill="#9A6700" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="middle" x="1124.0" y="347">Unsaved draft</text><rect fill="#E9F7EF" height="28" rx="14" ry="14" stroke="none" stroke-width="1" width="140" x="1208" y="328" /><text fill="#18794E" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="middle" x="1278.0" y="347">Offline ready</text><rect fill="#EAF2F8" height="52" rx="6" ry="6" stroke="#0F6B78" stroke-width="1" width="990" x="548" y="404" /><text fill="#0F6B78" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="566" y="436">Information banner: explain the condition and the corrective action in plain language.</text><rect fill="#FFFFFF" height="360" rx="10" ry="10" stroke="#C8D3DF" stroke-width="1" width="750" x="28" y="510" /><text fill="#17375E" font-family="DejaVu Sans" font-size="18" font-style="normal" font-weight="bold" text-anchor="start" x="48" y="546">Density and layout rules</text><circle cx="68" cy="576" fill="#0F6B78" r="13" stroke="none" stroke-width="1" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="middle" x="68" y="581">1</text><text fill="#1F2937" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="96" y="580">Top menu opens one contextual command panel below it.</text><circle cx="68" cy="620" fill="#0F6B78" r="13" stroke="none" stroke-width="1" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="middle" x="68" y="625">2</text><text fill="#1F2937" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="96" y="624">Patient workspace supports 4 tabs maximum.</text><circle cx="68" cy="664" fill="#0F6B78" r="13" stroke="none" stroke-width="1" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="middle" x="68" y="669">3</text><text fill="#1F2937" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="96" y="668">Primary clinical workspace uses 38/62 split pane.</text><circle cx="68" cy="708" fill="#0F6B78" r="13" stroke="none" stroke-width="1" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="middle" x="68" y="713">4</text><text fill="#1F2937" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="96" y="712">Tables paginate after 25 rows; preserve filters and selected row.</text><circle cx="68" cy="752" fill="#0F6B78" r="13" stroke="none" stroke-width="1" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="middle" x="68" y="757">5</text><text fill="#1F2937" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="96" y="756">Clinical forms save draft explicitly and warn before closing.</text><circle cx="68" cy="796" fill="#0F6B78" r="13" stroke="none" stroke-width="1" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="middle" x="68" y="801">6</text><text fill="#1F2937" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="96" y="800">No critical status is communicated by color alone.</text><rect fill="#FFFFFF" height="360" rx="10" ry="10" stroke="#C8D3DF" stroke-width="1" width="772" x="800" y="510" /><text fill="#17375E" font-family="DejaVu Sans" font-size="18" font-style="normal" font-weight="bold" text-anchor="start" x="820" y="546">Keyboard and accessibility</text><rect fill="#EAF2F8" height="28" rx="14" ry="14" stroke="none" stroke-width="1" width="32" x="820" y="560" /><text fill="#0F6B78" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="middle" x="836.0" y="579">1</text><text fill="#1F2937" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="864" y="580">F6 cycles top menu → command panel → patient tabs → workspace.</text><rect fill="#EAF2F8" height="28" rx="14" ry="14" stroke="none" stroke-width="1" width="32" x="820" y="604" /><text fill="#0F6B78" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="middle" x="836.0" y="623">2</text><text fill="#1F2937" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="864" y="624">Ctrl+K opens patient search; Ctrl+S saves draft.</text><rect fill="#EAF2F8" height="28" rx="14" ry="14" stroke="none" stroke-width="1" width="32" x="820" y="648" /><text fill="#0F6B78" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="middle" x="836.0" y="667">3</text><text fill="#1F2937" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="864" y="668">Alt+1…4 activates open patient tabs.</text><rect fill="#EAF2F8" height="28" rx="14" ry="14" stroke="none" stroke-width="1" width="32" x="820" y="692" /><text fill="#0F6B78" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="middle" x="836.0" y="711">4</text><text fill="#1F2937" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="864" y="712">Visible focus ring on every interactive control.</text><rect fill="#EAF2F8" height="28" rx="14" ry="14" stroke="none" stroke-width="1" width="32" x="820" y="736" /><text fill="#0F6B78" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="middle" x="836.0" y="755">5</text><text fill="#1F2937" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="864" y="756">Labels remain visible; placeholders are never the only label.</text><rect fill="#EAF2F8" height="28" rx="14" ry="14" stroke="none" stroke-width="1" width="32" x="820" y="780" /><text fill="#0F6B78" font-family="DejaVu Sans" font-size="13" font-style="normal" font-weight="bold" text-anchor="middle" x="836.0" y="799">6</text><text fill="#1F2937" font-family="DejaVu Sans" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="864" y="800">Minimum 44 px target for primary field-use controls.</text><line stroke="#C8D3DF" stroke-width="1" x1="0" x2="1600" y1="866" y2="866" /><text fill="#667085" font-family="DejaVu Sans" font-size="12" font-style="normal" font-weight="normal" text-anchor="start" x="24" y="888">Concept UX - planned / in progress</text><text fill="#667085" font-family="DejaVu Sans" font-size="12" font-style="normal" font-weight="normal" text-anchor="end" x="1576" y="888">Windows desktop • Offline-first</text></svg>